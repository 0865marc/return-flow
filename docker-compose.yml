services:
  api:
    build: ./api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./api:/api
    environment:
      DATABASE_URL: postgresql://return_flow:return_flow@postgres:5432/return_flow
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-10}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-5}
      RABBITMQ_URL: amqp://return_flow:return_flow@rabbitmq:5672/
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-return_flow.deliveries.commands}
      RABBITMQ_CONNECT_TIMEOUT: ${RABBITMQ_CONNECT_TIMEOUT:-5}
      RABBITMQ_PUBLISH_TIMEOUT: ${RABBITMQ_PUBLISH_TIMEOUT:-5}
      RABBITMQ_PUBLISH_CONCURRENCY: ${RABBITMQ_PUBLISH_CONCURRENCY:-64}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./api
    command: ["python", "worker.py"]
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./api:/api
    environment:
      DATABASE_URL: postgresql://return_flow:return_flow@postgres:5432/return_flow
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-10}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-5}
      RABBITMQ_URL: amqp://return_flow:return_flow@rabbitmq:5672/
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-return_flow.deliveries.commands}
      RABBITMQ_CONNECT_TIMEOUT: ${RABBITMQ_CONNECT_TIMEOUT:-5}
      RABBITMQ_PUBLISH_TIMEOUT: ${RABBITMQ_PUBLISH_TIMEOUT:-5}
      RABBITMQ_WORKER_CONCURRENCY: ${RABBITMQ_WORKER_CONCURRENCY:-8}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: return_flow
      POSTGRES_USER: return_flow
      POSTGRES_PASSWORD: return_flow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: return_flow
      RABBITMQ_DEFAULT_PASS: return_flow
    ports:
      - "127.0.0.1:5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  rabbitmq_data:

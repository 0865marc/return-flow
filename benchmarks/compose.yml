name: return-flow-benchmark

x-app-environment: &app-environment
  DATABASE_URL: postgresql://benchmark:benchmark@postgres:5432/benchmark
  DATABASE_POOL_MAX_SIZE: ${BENCH_POOL_SIZE:-10}
  DATABASE_POOL_TIMEOUT: ${BENCH_POOL_TIMEOUT:-5}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    cpus: ${BENCH_DB_CPUS:-1}
    healthcheck:
      disable: true
    volumes:
      - database:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: benchmark
      RABBITMQ_DEFAULT_PASS: benchmark
    cpus: ${BENCH_BROKER_CPUS:-1}
    healthcheck:
      disable: true
    volumes:
      - broker:/var/lib/rabbitmq

  api:
    image: return-flow-benchmark-v2:local
    build: ../api
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${BENCH_API_WORKERS:-1}", "--timeout-keep-alive", "5", "--no-access-log", "--log-level", "warning"]
    environment:
      <<: *app-environment
      RABBITMQ_URL: ${BENCH_RABBITMQ_URL:-}
    cpus: ${BENCH_API_CPUS:-1}
    healthcheck:
      disable: true

  worker:
    image: return-flow-benchmark-v2:local
    command: ["python", "-c", "import asyncio, logging; from worker import main; logging.basicConfig(level=logging.WARNING); asyncio.run(main())"]
    environment:
      <<: *app-environment
      RABBITMQ_URL: amqp://benchmark:benchmark@rabbitmq:5672/
      RABBITMQ_WORKER_CONCURRENCY: ${BENCH_WORKER_CONCURRENCY:-8}
    cpus: ${BENCH_WORKER_CPUS:-1}
    healthcheck:
      disable: true

  bench:
    image: return-flow-benchmark-v2:local
    entrypoint: ["python", "/benchmarks/driver.py"]
    working_dir: /benchmarks
    user: "${BENCH_UID:-1000}:${BENCH_GID:-1000}"
    environment:
      <<: *app-environment
      PYTHONPATH: /api:/benchmarks
      PYTHONDONTWRITEBYTECODE: "1"
    cpus: ${BENCH_CLIENT_CPUS:-1}
    volumes:
      - .:/benchmarks:ro
      - ${BENCH_OUTPUT:?BENCH_OUTPUT is required}:/results

volumes:
  database:
  broker:

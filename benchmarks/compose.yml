services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: return_flow_benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    cpus: 1.0
    mem_limit: 512m
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U benchmark -d return_flow_benchmark"]
      interval: 1s
      timeout: 3s
      retries: 30

  api:
    image: return-flow-benchmark-api:local
    build: ../api
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-access-log"]
    user: "${BENCH_UID:?Run benchmarks/run.py}:${BENCH_GID:?Run benchmarks/run.py}"
    environment:
      DATABASE_URL: postgresql://benchmark:benchmark@postgres:5432/return_flow_benchmark
      PERSISTENCE_ADAPTER: ${BENCH_ADAPTER:-postgres}
      DATABASE_POOL_MAX_SIZE: ${BENCH_POOL_SIZE:-10}
      DATABASE_POOL_TIMEOUT: ${BENCH_POOL_TIMEOUT:-5}
    cpus: 1.0
    mem_limit: 512m
    volumes:
      - ./:/benchmarks:ro
      - ${BENCH_OUTPUT_DIR:?Run benchmarks/run.py}:/results
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 30

  k6:
    image: grafana/k6:1.6.1
    profiles: ["load"]
    user: "${BENCH_UID:?Run benchmarks/run.py}:${BENCH_GID:?Run benchmarks/run.py}"
    environment:
      K6_NO_USAGE_REPORT: "true"
      BASE_URL: http://api:8000
    cpus: 1.0
    mem_limit: 512m
    volumes:
      - ./scenarios:/scenarios:ro
      - ${BENCH_OUTPUT_DIR:?Run benchmarks/run.py}:/results

volumes:
  database:
